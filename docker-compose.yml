x-common-variables: &common-variables
  DJANGO_ENV: prod
  DATABASE_ENGINE: django.db.backends.postgresql
  DATABASE_NAME: millarym
  DATABASE_USER: millarym
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-millarym}
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  STATIC_ROOT: /app/static
  MEDIA_ROOT: /app/media
  BACKUP_ROOT: /backups
  BACKUP_ACCEL: /_backups/
  BACKUP_AT: "02:30"
  BACKUP_KEEP_DAYS: "14"

services:
  app:
    build: .
    env_file: .env
    environment: *common-variables
    volumes:
      - media:/app/media
      # копии читает и ставит задания службе копий (страница «Резервные копии»)
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      collectstatic:
        condition: service_completed_successfully
    restart: unless-stopped
  collectstatic:
    build: .
    user: root
    env_file: .env
    environment: *common-variables
    volumes:
      - static:/app/static
      - media:/app/media
    # Папку фото первым может создать другой контейнер (от root) — отдаём её пользователю приложения.
    command: ["sh", "-c", "chown -R appuser:appuser /app/media && django-admin collectstatic --no-input"]
  migration:
    build: .
    env_file: .env
    environment: *common-variables
    command: ["django-admin", "migrate", "--no-input"]
    depends_on:
      postgres:
        condition: service_healthy
  scheduler:
    build: .
    env_file: .env
    environment: *common-variables
    command: ["django-admin", "scheduler", "--at", "03:00"]
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: millarym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-millarym}
      POSTGRES_DB: millarym
      TZ: Asia/Yekaterinburg
      BACKUP_AT: "02:30"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      # без :ro — при восстановлении фото возвращаются из архива
      - media:/media
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      - postgres
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: millarym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-millarym}
      POSTGRES_DB: millarym
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # новая (пустая) база создаётся несколько секунд — миграции ждут, пока она начнёт принимать подключения
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U millarym -d millarym"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
  frontend:
    build: ../millarym-front
    volumes:
      - static:/app/static
      - media:/app/media
      # скачивание копий: приложение проверяет право и отдаёт X-Accel-Redirect
      - ${BACKUP_DIR:-./backups}:/backups:ro
    ports:
      - "8000:80"
    depends_on:
      - collectstatic
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  static:
  media:
