x-common-variables: &common-variables
  DJANGO_ENV: prod
  DATABASE_ENGINE: django.db.backends.postgresql
  DATABASE_NAME: millarym
  DATABASE_USER: millarym
  DATABASE_PASSWORD: millarym
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  STATIC_ROOT: /app/static
  MEDIA_ROOT: /app/media

services:
  app:
    build: .
    env_file: .env
    environment: *common-variables
    volumes:
      - media:/app/media
    depends_on:
      - postgres
      - migration
    restart: unless-stopped
  collectstatic:
    build: .
    user: root
    env_file: .env
    environment: *common-variables
    volumes:
      - static:/app/static
    command: ["django-admin", "collectstatic", "--no-input"]
  migration:
    build: .
    env_file: .env
    environment: *common-variables
    command: ["django-admin", "migrate", "--no-input"]
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: millarym
      POSTGRES_PASSWORD: millarym
      POSTGRES_DB: millarym
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  frontend:
    build: ../millarym-front
    volumes:
      - static:/app/static
      - media:/app/media
    ports:
      - "8000:80"
    depends_on:
      - collectstatic
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  static:
  media:
