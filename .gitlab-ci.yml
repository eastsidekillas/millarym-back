stages:
  - test
  - build
  - deploy

default:
  before_script:
    - docker info

test:
  tags:
    - shell
  stage: test
  script:
    - docker build --target builder -t millarym-back-test .
    - docker run --rm -e DJANGO_ENV=test -w /app/src millarym-back-test /app/.venv/bin/python manage.py test
  only:
    - main
    - merge_requests

build_image:
  tags:
    - shell
  stage: build
  script:
    - |-
      docker buildx build \
        --tag 'docker-1.hosting.bp96.ru:5000/millarym/millarym-back:latest' \
        --platform=linux/amd64 --pull --push .
  only:
    - main

deploy:
  tags:
    - ssh
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    - docker compose pull
    - docker compose stop
    - docker compose up -d
  only:
    - main
  when: manual
