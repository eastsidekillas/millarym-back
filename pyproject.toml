[tool.poetry]
name = "millarym-back"
version = "0.1.0"
description = "CRM фабрики мягкой мебели «Миларум» — бэкенд"
authors = ["Тимофей Цепенников"]
license = "Private"
readme = "README.md"
packages = [{include = "*", from="src"}]

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2"
djangorestframework = "^3.16"
djangorestframework-simplejwt = "^5.5"
django-cors-headers = "^4.7"
django-filter = "^25.1"
drf-spectacular = "^0.28"
django-axes = "^8.0"
python-dotenv = "^1.1"
python-decouple = "^3.8"
pillow = "^11.3"
openpyxl = "^3.1"
psycopg2 = "^2.9.10"

[tool.poetry.group.dev.dependencies]
mypy = "^1.17"
django-stubs = "^5.2"
djangorestframework-stubs = "^3.16"

[tool.poetry.group.deploy.dependencies]
gunicorn = "^23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
